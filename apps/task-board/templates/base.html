<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Family Task Board{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="{{ url_for('static', filename='js/theme-switcher.js') }}"></script>
</head>
<body>
    <header>
        <div style="display: flex; justify-content: center; align-items: center;">
            <h1>Family Task Board</h1>
        </div>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            {% if admin %}
                <a href="{{ url_for('admin_add_task') }}">Add Task</a>
                <a href="{{ url_for('admin_add_user') }}">Add User</a>
                <a href="{{ url_for('admin_reset_all') }}" onclick="return confirm('Are you sure you want to delete all tasks and reset all points? This cannot be undone!')" style="background-color: #dc3545; color: white; margin-left: 1rem;">Reset All</a>
            {% else %}
                <a href="{{ url_for('admin_index') }}">Admin</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="theme-footer">
        <select id="theme-select" onchange="changeTheme(this.value)">
            <option value="cyberpunk">🤖 Cyberpunk</option>
            <option value="light">☀️ Light & Minimal</option>
            <option value="forest">🌲 Forest</option>
        </select>
    </footer>
</body>
</html>
